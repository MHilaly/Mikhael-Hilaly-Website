name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check page structure, links and assets
        run: python3 scripts/validate.py
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check contact form outcomes without sending messages
        run: node --test scripts/contact-form.test.cjs
